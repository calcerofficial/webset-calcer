<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Prestasi - Admin Calcer</title>
    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="Prestasi_admin.css">
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <i class="fa-solid fa-graduation-cap"></i>
            <h2>Calcer Admin</h2>
        </div>
        <ul class="nav-links">
            <li>
                <a href="dashboard_admin.html"><i class="fa-solid fa-gauge"></i><span>Dashboard</span></a>
            </li>
            <li>
                <a href="mahasiswa_admin.html"><i class="fa-solid fa-users"></i><span>Data Mahasiswa</span></a>
            </li>
            <li class="active">
                <a href="Prestasi_admin.html"><i class="fa-solid fa-trophy"></i><span>Kelola Prestasi</span></a>
            </li>
            <li>
                <a href="kenangan_admin.html"><i class="fa-solid fa-images"></i><span>Kelola Kenangan</span></a>
            </li>
        </ul>
        <div class="sidebar-footer">
            <a href="login_admin.html" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i><span>Keluar</span></a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Topbar -->
        <header class="topbar">
            <div class="welcome-text">
                <h1>Kelola Data Prestasi</h1>
                <p>Tambah, edit, dan hapus pencapaian kelas Calcer Official</p>
            </div>
            <div class="user-profile">
                <i class="fa-solid fa-circle-user"></i>
                <span>Muhammad Nabil</span>
            </div>
        </header>

        <!-- CRUD Section -->
        <section class="crud-section">
            <div class="table-header-action">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchPrestasi" placeholder="Cari judul atau kategori...">
                </div>
                <button class="btn-primary" id="btnOpenAddModal">
                    <i class="fa-solid fa-plus"></i> Tambah Prestasi
                </button>
            </div>

            <!-- Tabel Data -->
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Foto</th>
                            <th>Judul Prestasi</th>
                            <th>Kategori</th>
                            <th>Keterangan</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="prestasiTableBody">
                        <!-- Data akan dimasukkan secara dinamis via JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Modal Form (Tambah / Edit) -->
    <div class="modal" id="modalPrestasi">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Tambah Data Prestasi</h3>
                <span class="close-modal" id="btnCloseModal">&times;</span>
            </div>
            <form id="formPrestasi">
                <input type="hidden" id="editId" value="">

                <div class="form-group">
                    <label for="inputJudul">Judul Prestasi *</label>
                    <input type="text" id="inputJudul" maxlength="150" required placeholder="Contoh: Juara 1 Web Design Competition">
                </div>

                <div class="form-group">
                    <label for="inputKategori">Kategori *</label>
                    <select id="inputKategori" required>
                        <option value="" disabled selected>-- Pilih Kategori --</option>
                        <option value="Akademik">Akademik</option>
                        <option value="Non Akademik">Non Akademik</option>
                        <option value="5K2S PROJECT">5K2S PROJECT</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="inputKeterangan">Keterangan</label>
                    <textarea id="inputKeterangan" rows="3" maxlength="300" placeholder="Deskripsi singkat prestasi (maks 300 karakter)"></textarea>
                </div>

                <div class="form-group">
                    <label for="inputFoto">Upload Foto / Sertifikat (Opsional)</label>
                    <input type="file" id="inputFoto" accept="image/*">
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-secondary" id="btnCancelModal">Batal</button>
                    <button type="submit" class="btn-primary">Simpan Data</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Imports -->
    <script src="../koneksi_database.js"></script>
    <script src="Prestasi_admin.js"></script>
</body>
</html>
